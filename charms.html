<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حاسبة التمائم</title>
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#191612;--bar:#27211A;--card:#241F19;--ink:#F2EBDD;--muted:#A99E8C;--line:#3B3328;--field:#15120E;--gold:#EDB84C;--teal:#58C9B6;--cta:#E3A72F;--cta-ink:#3A2A12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tajawal,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.top{position:sticky;top:0;z-index:5;background:var(--bar);padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:17px;font-weight:800;flex:1}.top .home{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);color:var(--ink)}.tag{font-size:11px;background:var(--cta);color:var(--cta-ink);border-radius:6px;padding:2px 7px;font-weight:800}
.wrap{max-width:560px;margin:0 auto;padding:12px 12px 100px}
.sec{background:var(--card);border:1px solid var(--line);border-inline-start:6px solid var(--tc);border-radius:18px;padding:12px;margin-bottom:12px}
.sec h2{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}.sec h2 .dot{width:10px;height:10px;border-radius:50%}
.sec .sub{color:var(--muted);font-size:12.5px;margin:0 0 8px}
.piece{background:var(--field);border:1px solid var(--line);border-radius:14px;padding:8px 8px 12px;margin-top:8px}
.piece .pl{font-size:12.5px;color:var(--muted);font-weight:700;margin:0 6px 2px}
.ba{display:flex;align-items:center}
.side{flex:1;min-width:0;text-align:center}.side small{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:2px}
.arrow{color:var(--gold);font-size:22px;flex:none;width:24px;text-align:center}
.band{display:flex;align-items:center;background:var(--bar);border:1px solid var(--line);border-radius:10px;height:30px;margin-bottom:10px}
.band span{flex:1;text-align:center;font-size:13px;font-weight:800}.band span:first-child{color:var(--muted)}.band span:last-child{color:var(--gold)}
.band i{width:24px;flex:none;align-self:stretch;position:relative}.band i:after{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:var(--line)}
.tri{position:relative;width:min(140px,100%);height:142px;margin:0 auto}
.ch{position:absolute;width:56px;text-align:center;padding:0;display:flex;flex-direction:column;align-items:center}.ch .ic{width:50px;height:50px;display:block;border-radius:12px}
.ch .ic svg{width:100%;height:100%;display:block;overflow:visible}.ch .lv{font:700 11.5px Changa;color:var(--ink);line-height:1;display:inline-block;background:#3B3328;border-radius:6px;padding:2px 6px;margin-top:2px}
.ch.c0{left:calc(50% - 28px);top:0}.ch.c1{left:0;top:74px}.ch.c2{right:0;top:74px}
.ch.sel .ic{outline:2.5px solid var(--gold);outline-offset:2px}
.empty{width:50px;height:50px;display:block}.empty svg{width:100%;height:100%;display:block}
.quick{display:flex;gap:6px;margin-top:8px}.quick button{flex:1;height:36px;border-radius:10px;background:var(--bar);border:1px solid var(--line);font-size:13px;font-weight:700}
.sum{position:fixed;bottom:0;left:0;right:0;background:var(--bar);border-top:1px solid var(--line);padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:6}
.sum .g{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.box .lb{display:flex;align-items:center;justify-content:center;gap:3px;margin-top:3px;max-width:100%}.box .lb i{width:17px;height:17px;display:block;flex:none}.box .lb i svg{width:100%;height:100%;display:block}
.box{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:7px 4px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:58px;min-width:0;overflow:hidden}.box b{display:block;max-width:100%;font:700 16px Changa;line-height:1.25;white-space:nowrap}.box small{color:var(--muted);font-size:10.5px;line-height:1.2;white-space:nowrap}
.box.k b{color:var(--gold)}.box .bi{display:none}.box .bi svg{width:100%;height:100%;display:block}
.taps{display:flex;gap:2px;margin-top:3px}.taps i{width:7px;height:4px;border-radius:2px;background:#3B3328}.taps i.on{background:var(--gold)}
.tps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}.tps button{height:32px;border-radius:8px;background:var(--field);border:1px solid var(--line);font:700 13px Changa}.tps button[aria-pressed="true"]{background:var(--gold);color:#3A2A12}.tps button:disabled{opacity:.3}.tpn{margin:6px 0 0;color:var(--muted);font-size:12px;text-align:center}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.5);display:flex;align-items:flex-end}
.sheet[hidden]{display:none}.sh{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px)}
.sh h3{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:10px}.sh h3 .ic{width:44px;height:44px}.sh h3 .ic svg{width:100%;height:100%}
.row{margin-top:10px}.row label{font-size:13px;color:var(--muted);font-weight:700}
.lvls{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:6px}.lvls button{height:34px;border-radius:8px;background:var(--field);border:1px solid var(--line);font:700 13px Changa}
.lvls button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}.lvls button:disabled{opacity:.3}
.done{width:100%;height:44px;margin-top:12px;border-radius:12px;background:var(--cta);color:var(--cta-ink);font-weight:800;font-size:16px}
.note{color:var(--muted);font-size:12px;text-align:center;margin:6px 0 0}
.stats{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px}.stats h3{font-size:17px;margin:0 0 4px}
.st-row{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 64px;align-items:center;column-gap:4px;padding:9px 6px;border-top:1px dashed var(--line);font-size:14.5px}
.st-row>*{min-width:0}.st-row .nm{text-align:start;font-weight:500}.st-row .c{text-align:center;white-space:nowrap;font:600 14px Changa}
.st-row .now{color:var(--muted)}.st-row .aft{font-weight:700}
.st-row .g{justify-self:center;font-size:13px;font-weight:700;border-radius:999px;padding:2px 7px;background:color-mix(in srgb,var(--teal) 20%,transparent);color:var(--teal)}.st-row .g.none{background:transparent;color:var(--muted);font-weight:500}
.st-row.head{border-top:0;margin-top:10px;border-radius:9px;background:var(--field);border-inline-start:5px solid var(--sc);padding:8px 6px;padding-inline-start:8px}
.st-row.head .nm{font-size:13.5px;font-weight:700;white-space:nowrap}.st-row.head .c{font:700 12px Tajawal;color:var(--muted)}.st-row.head+.st-row{border-top:0}
@media (max-width:384px){.st-row{grid-template-columns:minmax(0,1fr) 54px 62px 66px;column-gap:4px;font-size:13.5px}.st-row .c{font-size:13px}.st-row .g{font-size:12px;padding:2px 6px}}
</style></head><body>

<main class="wrap" id="main"></main>
<div class="sum"><div class="g" id="sum"></div></div>
<section class="sheet" id="sheet" hidden><div class="sh" id="sh"></div></section>

function lvls(which,cur,min){var cl=lvOf(cur),ml=lvOf(min),h='<div class="lvls" data-w="'+which+'">';for(var l=0;l<=22;l++)h+='<button data-l="'+l+'" aria-pressed="'+(l===cl)+'"'+(l<ml?" disabled":"")+'>'+l+'</button>';if(cl<5||cl>21)return h+'</div><p class="tpn">لا توجد دقات في هذا المستوى</p>';h+='</div><div class="tps" data-w="'+which+'">';
 for(var t=0;t<5;t++){var f=cl*5+t;h+='<button data-tp="'+t+'" aria-pressed="'+(t===tapOf(cur))+'"'+((f<min||cl===22&&t>0)?" disabled":"")+'>'+t+'/5</button>';}return h+'</div>';}
function openSheet(type,i,all){sel=[type,i,all];var x=all?{c:S[type][0].c,t:S[type][0].t}:S[type][i];var tn=TYPES.filter(function(t){return t[0]===type;})[0][1];
 document.getElementById("sh").innerHTML='<h3><span class="ic">'+IC[Math.max(1,Math.min(lvOf(x.t)||lvOf(x.c)||1,22))+"_"+type]+'</span>'+(all?"كل تمائم "+tn:"تميمة "+tn+" · قطعة "+(Math.floor(i/3)+1))+'</h3>'+
  '<div class="row"><label>المستوى الحالي (قبل) والدقات</label>'+lvls("c",x.c,0)+'</div><div class="row"><label>الهدف (بعد) والدقات</label>'+lvls("t",x.t,x.c)+'</div><button class="done" id="done">تم</button>';
 document.getElementById("sheet").hidden=false;render();}
document.addEventListener("click",function(e){
 var b=e.target.closest(".ch");if(b){openSheet(b.dataset.t,+b.dataset.i,false);return;}
 var a=e.target.closest("[data-all]");if(a){openSheet(a.dataset.all,0,true);return;}
 var r=e.target.closest("[data-reset]");if(r){S[r.dataset.reset].forEach(function(x){x.c=0;x.t=0;});render();return;}
 var L=e.target.closest(".lvls button,.tps button");if(L&&sel){var w=L.parentElement.dataset.w,list=sel[2]?S[sel[0]]:[S[sel[0]][sel[1]]];
   list.forEach(function(x){var f=L.dataset.l!==undefined?(+L.dataset.l)*5:lvOf(x[w])*5+(+L.dataset.tp);x[w]=f;if(w==="c"&&x.t<f)x.t=f;if(w==="t"&&x.t<x.c)x.t=x.c;});openSheet(sel[0],sel[1],sel[2]);return;}
 if(e.target.id==="done"||e.target.id==="sheet"){document.getElementById("sheet").hidden=true;sel=null;render();}
});
